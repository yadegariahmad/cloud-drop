# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      target: runtime
    volumes: []
    command: ["fastapi", "run", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  frontend:
    build:
      target: runtime
    ports:
      - "80:80"
    volumes: []
    restart: unless-stopped

  db:
    restart: unless-stopped
